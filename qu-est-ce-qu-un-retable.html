<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Qu'est-ce qu'un retable ? - RETABLES de FLANDRE</title>
    <link rel="icon" type="image/jpg" href="images/previous-image/logo.jpg">

    <!-- SEO & partages sociaux -->
    <meta name="description" content="Histoire et composition des retables des XVIIe et XVIIIe siècles en Flandre française : contexte spirituel, structure, matériaux et articles scientifiques (Hertel, Oger-Leurent).">
    <meta name="theme-color" content="#81b29a">
    <meta property="og:type" content="article">
    <meta property="og:title" content="Qu'est-ce qu'un retable ? — RETABLES de FLANDRE">
    <meta property="og:description" content="Découvrez l'histoire et la composition de ces œuvres d'art religieux flamandes.">
    <meta property="og:image" content="images/previous-image/schemadunretable.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <!-- CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap"
          rel="stylesheet">

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bootstrap-icons.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <link href="css/sidebar.css" rel="stylesheet">
    <link href="css/components/cards.css" rel="stylesheet">
    <link href="css/components/badges.css" rel="stylesheet">
    <link href="css/components/notifications.css" rel="stylesheet">
    <link href="css/responsive.css" rel="stylesheet">
</head>

<body>

<main>
    <div id="app">

        <!-- Sidebar -->
        <rf-sidebar
            :is-open="sidebarOpen"
            current-page="retable"
            @close="sidebarOpen = false">
        </rf-sidebar>

        <!-- Overlay backdrop mobile -->
        <div class="rf-sidebar-overlay" :class="{ 'is-active': sidebarOpen }" @click="sidebarOpen = false"></div>

        <!-- Bouton hamburger -->
        <button class="rf-sidebar-fab" type="button" aria-label="Toggle menu"
                @click="sidebarOpen = !sidebarOpen">
            <span></span><span></span><span></span>
        </button>

        <!-- Contenu principal -->
        <div :class="['rf-content', { 'is-expanded': !sidebarOpen }]">

            <!-- Hero avec image cliquable (schéma) -->
            <rf-hero-retable @open-schema="openSchema"></rf-hero-retable>

            <!-- Texte collectif -->
            <rf-texte-collectif></rf-texte-collectif>

            <!-- Articles scientifiques -->
            <section class="section-padding" style="padding-top: 80px; padding-bottom: 80px;">
                <div class="container">
                    <div class="row align-items-end mb-4">
                        <div class="col-lg-8">
                            <h2 class="mb-2">Publications scientifiques</h2>
                            <p class="mb-0" style="color: #717275;">Articles de recherche sur les retables de Flandre</p>
                        </div>
                    </div>
                    <div class="row g-4">
                        <div class="col-lg-6 col-12">
                            <rf-article-hertel></rf-article-hertel>
                        </div>
                        <div class="col-lg-6 col-12">
                            <rf-article-oger></rf-article-oger>
                        </div>
                    </div>
                </div>
            </section>

            <rf-newsletter-cta></rf-newsletter-cta>
            <rf-contact></rf-contact>
            <rf-footer></rf-footer>
        </div>

        <!-- Modale schéma du retable -->
        <div class="image-modal" :class="{ 'is-open': schemaModalOpen }"
             :aria-hidden="String(!schemaModalOpen)" @click.self="closeSchema">
            <button class="image-modal-close" type="button" @click="closeSchema" aria-label="Fermer">✕</button>
            <div class="image-modal-content" role="dialog" aria-modal="true">
                <div class="image-modal-header">
                    <h3 class="image-modal-title">Schéma d'un retable</h3>
                </div>
                <div class="image-modal-body">
                    <img class="image-modal-img" src="images/previous-image/schemadunretable.jpg"
                         alt="Schéma d'un retable">
                </div>
            </div>
        </div>

    
        <rf-lightbox></rf-lightbox>
    </div>
</main>

<!-- Vue 3 CDN -->
<script src="js/vue.js"></script>

<!-- Bootstrap + EmailJS -->
<script src="js/bootstrap.bundle.min.js"></script>

<!--REMOVE-->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<!-- Données (à charger AVANT les composants) -->
<script src="js/content.js"></script>
<script src="js/news.js"></script>

<!-- Composants Vue partagés -->
<script src="js/vue-components.js"></script>

<!-- App Vue page retable -->
<script src="js/vue-app-retable.js"></script>

</body>
</html>
