name: Deploy v2 to Remote Server via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Cache-busting : ajoute ?v=<commit> aux JS/CSS locaux de chaque page, pour
      # que les navigateurs rechargent ces fichiers à chaque déploiement au lieu
      # de garder une ancienne copie en cache (fichiers du dépôt inchangés).
      - name: Version des JS/CSS
        run: |
          V="${GITHUB_SHA::8}"
          perl -pi -e 's#((?:src|href)="(?:js|css)/[^"?]+\.(?:js|css))"#$1?v='"$V"'"#g' *.html
          grep -c "?v=$V" *.html

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Ionos ne répond pas toujours du premier coup : jusqu'à 5 essais
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts && break
            echo "ssh-keyscan échoué (essai $i), nouvel essai dans 10 s"
            sleep 10
          done
          grep -q . ~/.ssh/known_hosts

      # La v2 vit dans un SOUS-DOSSIER du site v1 :
      # https://www.retablesdeflandre.fr/retableFlandreV2/
      # Le --delete ne s'applique qu'à ce sous-dossier ; la v1 (racine) n'est pas touchée.
      - name: Deploy via rsync over SSH
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.DS_Store' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            --exclude 'server.js' \
            --exclude 'start-server.sh' \
            --exclude 'deploy.sh' \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/html5up-editorial/retableFlandreV2/

      - name: Fix permissions
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "chmod -R 755 ~/html5up-editorial/retableFlandreV2"
