<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actualités - RETABLES de FLANDRE</title>
    <link rel="icon" type="image/jpg" href="images/previous-image/logo.jpg">

    <!-- SEO & partages sociaux -->
    <meta name="description" content="Toutes les actualités de l'association : assemblées générales, visites estivales, sorties culturelles, formations de guides et hommages. Recherche et filtres par catégorie.">
    <meta name="theme-color" content="#9AB0D1">
    <link rel="canonical" href="https://www.retablesdeflandre.fr/actualites.html">
    <meta property="og:url" content="https://www.retablesdeflandre.fr/actualites.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Actualités — RETABLES de FLANDRE">
    <meta property="og:description" content="L'association en mouvement : AG, visites, sorties, formations. Filtrable par catégorie.">
    <meta property="og:image" content="https://www.retablesdeflandre.fr/images/2026/Looberghe/loob1.JPG">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bootstrap-icons.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <link href="css/sidebar.css" rel="stylesheet">
    <link href="css/components/cards.css" rel="stylesheet">
    <link href="css/components/badges.css" rel="stylesheet">
    <link href="css/components/notifications.css" rel="stylesheet">
    <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<main>
<div id="app">

    <rf-sidebar :is-open="sidebarOpen" current-page="actualites" @close="sidebarOpen = false"></rf-sidebar>

    <div class="rf-sidebar-overlay" :class="{ 'is-active': sidebarOpen }" @click="sidebarOpen = false"></div>

    <button class="rf-sidebar-fab" type="button" aria-label="Toggle menu" @click="sidebarOpen = !sidebarOpen">
        <span></span><span></span><span></span>
    </button>

    <div :class="['rf-content', { 'is-expanded': !sidebarOpen }]">
        <rf-news-banner></rf-news-banner>

        <!-- ─────────────────────────────────────────────
             HERO
        ───────────────────────────────────────────────── -->
        <section class="about-section section-padding" id="section_1">
            <div class="container">
                <div class="d-flex align-items-center mb-3">
                    <img src="images/previous-image/logo.jpg" alt="Logo"
                         style="width:70px;height:70px;object-fit:cover;border-radius:12px;margin-right:15px;">
                    <div>
                        <h2 class="mb-0">Actualités</h2>
                        <p class="mb-0" style="color:#717275;">L'association en mouvement</p>
                    </div>
                </div>
                <p class="mt-3 mb-0" style="line-height:1.7;color:#555;max-width:780px;">
                    Retrouvez ici tout ce qui se passe à l'association :
                    <strong>assemblées générales</strong>, <strong>visites guidées</strong>,
                    <strong>formations</strong>, <strong>sorties culturelles</strong>,
                    cérémonies, hommages et publications.
                    Utilisez la barre de recherche ou les filtres ci-dessous pour trouver
                    une actualité précise.
                </p>
            </div>
        </section>

        <!-- ─────────────────────────────────────────────
             Feed unifié (recherche + filtres + pagination)
        ───────────────────────────────────────────────── -->
        <rf-actu-feed :per-page="6"></rf-actu-feed>

        <rf-contact></rf-contact>
        <rf-footer></rf-footer>

    </div>

    <rf-lightbox></rf-lightbox>
</div>
</main>

<script src="js/vue.global.prod.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="js/content.js"></script>
<script src="js/news.js"></script>
<script src="js/vue-components.js"></script>
<script src="js/vue-app.js"></script>
</body>
</html>
