<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RETABLES de FLANDRE - Accueil</title>
    <link rel="icon" type="image/jpg" href="images/previous-image/logo.jpg">

    <!-- CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap"
          rel="stylesheet">

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bootstrap-icons.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <link href="css/sidebar.css" rel="stylesheet">
    <link href="css/components/cards.css" rel="stylesheet">
    <link href="css/components/badges.css" rel="stylesheet">
    <link href="css/components/notifications.css" rel="stylesheet">
    <link href="css/responsive.css" rel="stylesheet">
</head>

<body>

<main>
    <div id="app">

        <!-- Sidebar -->
        <rf-sidebar
            :is-open="sidebarOpen"
            current-page="index"
            @close="sidebarOpen = false">
        </rf-sidebar>

        <!-- Overlay backdrop mobile -->
        <div class="rf-sidebar-overlay" :class="{ 'is-active': sidebarOpen }" @click="sidebarOpen = false"></div>

        <!-- Bouton hamburger -->
        <button class="rf-sidebar-fab" type="button" aria-label="Toggle menu"
                @click="sidebarOpen = !sidebarOpen">
            <span></span><span></span><span></span>
        </button>

        <!-- Contenu principal -->
        <div :class="['rf-content', { 'is-expanded': !sidebarOpen }]">
            <rf-hero-home></rf-hero-home>
            <rf-gallery-carousel></rf-gallery-carousel>
            <rf-newsletter-cta></rf-newsletter-cta>
            <rf-contact></rf-contact>
            <rf-footer></rf-footer>
        </div>

    </div>
</main>

<!-- Vue 3 CDN -->
<script src="js/vue.global.prod.js"></script>

<!-- Bootstrap + EmailJS -->
<script src="js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<!-- Composants Vue partagés -->
<script src="js/vue-components.js"></script>

<!-- App Vue page accueil -->
<script src="js/vue-app-index.js"></script>

</body>

</html>
