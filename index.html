<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RETABLES de FLANDRE - Accueil</title>
    <link rel="icon" type="image/jpg" href="images/previous-image/logo.jpg">

    <!-- SEO & partages sociaux -->
    <meta name="description" content="Association loi 1901 fondée en 1991, dédiée à la préservation et à la valorisation des ~150 retables des XVIIe et XVIIIe siècles dans l'arrondissement de Dunkerque (Flandre française).">
    <meta name="theme-color" content="#9AB0D1">
    <meta property="og:type" content="website">
    <meta property="og:title" content="RETABLES de FLANDRE — Association">
    <meta property="og:description" content="~150 retables flamands des XVIIe-XVIIIe siècles, 50 églises, 30 ans d'engagement pour la sauvegarde du patrimoine.">
    <meta property="og:image" content="images/previous-image/bambecque.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <!-- CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap"
          rel="stylesheet">

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bootstrap-icons.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <link href="css/sidebar.css" rel="stylesheet">
    <link href="css/components/cards.css" rel="stylesheet">
    <link href="css/components/badges.css" rel="stylesheet">
    <link href="css/components/notifications.css" rel="stylesheet">
    <link href="css/responsive.css" rel="stylesheet">
</head>

<body>

<main>
    <div id="app">

        <!-- Sidebar -->
        <rf-sidebar
            :is-open="sidebarOpen"
            current-page="index"
            @close="sidebarOpen = false">
        </rf-sidebar>

        <!-- Overlay backdrop mobile -->
        <div class="rf-sidebar-overlay" :class="{ 'is-active': sidebarOpen }" @click="sidebarOpen = false"></div>

        <!-- Bouton hamburger -->
        <button class="rf-sidebar-fab" type="button" aria-label="Toggle menu"
                @click="sidebarOpen = !sidebarOpen">
            <span></span><span></span><span></span>
        </button>

        <!-- Contenu principal -->
        <div :class="['rf-content', { 'is-expanded': !sidebarOpen }]">
            <rf-news-banner></rf-news-banner>
            <rf-hero-home></rf-hero-home>
            <rf-latest-news></rf-latest-news>
            <rf-gallery-carousel></rf-gallery-carousel>
            <rf-newsletter-cta></rf-newsletter-cta>
            <rf-contact></rf-contact>
            <rf-footer></rf-footer>
        </div>

    
        <rf-lightbox></rf-lightbox>
    </div>
</main>

<!-- Vue 3 CDN -->
<script src="js/vue.global.prod.js"></script>

<!-- Bootstrap + EmailJS -->
<script src="js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<!-- Données (à charger AVANT les composants) -->
<script src="js/content.js"></script>
<script src="js/news.js"></script>

<!-- Composants Vue partagés -->
<script src="js/vue-components.js"></script>

<!-- App Vue page accueil -->
<script src="js/vue-app-index.js"></script>

</body>

</html>
